name: Center Main Column

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/center-main-column.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Center desktop content column
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''    @media (min-width:980px){\n      .project{width:100%}\n    }'''
          new = '''    @media (min-width:980px){\n      .grid,footer{margin-left:auto;margin-right:auto}\n      .project{width:100%}\n    }'''
          if old not in s:
              raise SystemExit('desktop media marker not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit desktop centering
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Center main hub column on desktop"
          git push
