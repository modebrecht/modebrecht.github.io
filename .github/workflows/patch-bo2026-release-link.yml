name: Patch BO2026 Release Link

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-bo2026-release-link.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch recovery page
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('bo2026-recovery.html')
          html = path.read_text(encoding='utf-8')

          old_actions = '<div class="actions"><button class="btn" id="downloadScript">↓ bo2026_recover.py herunterladen</button><button class="btn secondary" id="copyScript">⧉ Python-Skript kopieren</button></div>'
          new_actions = '<div class="actions"><a class="btn" style="grid-column:1/-1" href="https://github.com/modebrecht/modebrecht.github.io/releases/download/bo2026-recovery-latest/BO2026-Recovery-Windows.exe">🪟 Windows One-Click (.exe)</a><button class="btn secondary" id="downloadScript">↓ Python-Version</button><button class="btn secondary" id="copyScript">⧉ Python-Skript kopieren</button></div>'

          old_note = '<p class="note"><strong>Windows One-Click:</strong> Der Build-Workflow erzeugt eine eigenständige <code>BO2026-Recovery-Windows.exe</code> ohne Python/pip/Git auf dem Ziel-PC. Sobald der erste Build fertig ist, wird hier ein direkter EXE-Download ergänzt.</p>'
          new_note = '<p class="note"><strong>Windows One-Click:</strong> Fertige Standalone-EXE – kein Python, pip oder Git auf dem Ziel-PC nötig. Die EXE ist aktuell nicht öffentlich code-signiert; Windows SmartScreen kann deshalb warnen. <a href="https://github.com/modebrecht/modebrecht.github.io/releases/download/bo2026-recovery-latest/BO2026-Recovery-Windows.exe.sha256" target="_blank" rel="noopener">SHA-256 prüfen</a>.</p>'

          if old_actions not in html:
              raise SystemExit('actions marker not found')
          if old_note not in html:
              raise SystemExit('note marker not found')

          html = html.replace(old_actions, new_actions, 1)
          html = html.replace(old_note, new_note, 1)
          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bo2026-recovery.html
          git commit -m "Link Windows one-click BO2026 recovery [skip ci]"
          git push
