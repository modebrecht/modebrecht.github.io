name: Swap BO Labels

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/swap-bo-labels.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update hero and BO card label
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          hero_old = '<h1>GSU<br><span class="gradient">BO 2026</span></h1>'
          hero_new = '<h1>GSU<br><span class="gradient">Berufliche Orientierung 2026</span></h1>'
          card_old = '<div class="project-copy"><h2>Berufliche Orientierung</h2><p>Bewerbungsdossier erstellen</p></div>'
          card_new = '<div class="project-copy"><h2>BO 2026</h2><p>Bewerbungsdossier erstellen</p></div>'
          if hero_old not in s:
              raise SystemExit('hero marker not found')
          if card_old not in s:
              raise SystemExit('BO card marker not found')
          s = s.replace(hero_old, hero_new, 1)
          s = s.replace(card_old, card_new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit label swap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Clarify BO 2026 page hierarchy"
          git push
