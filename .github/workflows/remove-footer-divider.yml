name: Remove Footer Divider

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-footer-divider.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove footer divider
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'padding:18px 6px 0;border-top:1px solid var(--border);color:var(--muted)'
          new = 'padding:18px 6px 0;color:var(--muted)'
          if old not in s:
              raise SystemExit('footer divider marker not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit footer divider removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Remove footer divider"
          git push
