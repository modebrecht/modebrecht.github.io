name: Build BO2026 Recovery EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - bo2026-recovery.html
      - .github/workflows/build-bo2026-recovery.yml

permissions:
  contents: write

concurrency:
  group: bo2026-recovery-windows
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract embedded recovery script
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          html = Path('bo2026-recovery.html').read_text(encoding='utf-8')
          match = re.search(
              r'<script type="text/plain" id="recoveryPython">(.*?)</script>',
              html,
              flags=re.S,
          )
          if not match:
              raise SystemExit('Embedded recoveryPython script not found')

          out = Path('build-src/bo2026_recover.py')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(match.group(1).lstrip(), encoding='utf-8')
          compile(out.read_text(encoding='utf-8'), str(out), 'exec')
          print(f'Extracted {out}')
          '@ | Set-Content -Encoding UTF8 extract_recovery.py
          py extract_recovery.py

      - name: Install build dependencies
        shell: pwsh
        run: |
          py -m pip install --upgrade pip
          py -m pip install pyinstaller python-snappy "git+https://github.com/cclgroupltd/ccl_chromium_reader.git@ef840de30221c4d65bc96d2f4d9057e9ef2f526d"

      - name: Build standalone Windows executable
        shell: pwsh
        run: |
          py -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --console `
            --name BO2026-Recovery-Windows `
            --collect-all ccl_chromium_reader `
            --hidden-import snappy `
            build-src/bo2026_recover.py

      - name: Smoke-test executable
        shell: pwsh
        run: |
          & .\dist\BO2026-Recovery-Windows.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash .\dist\BO2026-Recovery-Windows.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  BO2026-Recovery-Windows.exe" | Set-Content -Encoding ASCII .\dist\BO2026-Recovery-Windows.exe.sha256
          Write-Host "SHA256: $hash"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BO2026-Recovery-Windows
          path: |
            dist/BO2026-Recovery-Windows.exe
            dist/BO2026-Recovery-Windows.exe.sha256
          if-no-files-found: error

      - name: Publish stable GitHub Release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'bo2026-recovery-latest'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title 'BO2026 Recovery – Windows' `
              --notes 'Standalone Windows x64 emergency recovery tool for BO2026. Read-only browser profile recovery.' `
              --latest
          }
          gh release upload $tag `
            .\dist\BO2026-Recovery-Windows.exe `
            .\dist\BO2026-Recovery-Windows.exe.sha256 `
            --repo $env:GITHUB_REPOSITORY `
            --clobber
