name: Build BO2026 Recovery EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - bo2026-recovery.html
      - recovery/bo2026_recover_windows.py
      - .github/workflows/build-bo2026-recovery.yml

permissions:
  contents: write

concurrency:
  group: bo2026-recovery-windows
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate recovery source
        shell: pwsh
        run: |
          @'
          import importlib.util
          from pathlib import Path

          path = Path('recovery/bo2026_recover_windows.py')
          compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          spec = importlib.util.spec_from_file_location('bo_recovery', path)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          source = mod.load_base_source()
          assert mod.TARGET_MARKER in source
          assert mod.OUT_MARKER in source
          assert mod.normalize_custom('bo.schule.ch/test')[1:] == ('bo.schule.ch', 'https://bo.schule.ch')
          assert mod.normalize_custom('http://localhost:8080/foo')[1:] == ('localhost:8080', 'http://localhost:8080')
          print('Recovery source + custom domain parser OK')
          '@ | Set-Content -Encoding UTF8 validate_recovery.py
          py validate_recovery.py

      - name: Install build dependencies
        shell: pwsh
        run: |
          py -m pip install --upgrade pip
          py -m pip install pyinstaller python-snappy "git+https://github.com/cclgroupltd/ccl_chromium_reader.git@ef840de30221c4d65bc96d2f4d9057e9ef2f526d"

      - name: Build standalone Windows executable
        shell: pwsh
        run: |
          py -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --console `
            --name BO2026-Recovery-Windows `
            --add-data "bo2026-recovery.html;." `
            --collect-all ccl_chromium_reader `
            --hidden-import snappy `
            recovery/bo2026_recover_windows.py

      - name: Smoke-test executable
        shell: pwsh
        run: |
          & .\dist\BO2026-Recovery-Windows.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $file = '.\dist\BO2026-Recovery-Windows.exe'
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  BO2026-Recovery-Windows.exe" | Set-Content -Encoding ASCII "$file.sha256"
          Write-Host "SHA256: $hash"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BO2026-Recovery-Windows
          path: |
            dist/BO2026-Recovery-Windows.exe
            dist/BO2026-Recovery-Windows.exe.sha256
          if-no-files-found: error

      - name: Publish stable GitHub Release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'bo2026-recovery-latest'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'BO2026 Recovery – Windows' --notes 'One BO2026 Windows recovery tool. Choose Vercel, Render, both, or enter a custom domain. Read-only browser profile recovery.' --latest
          }

          foreach ($asset in @(
            'BO2026-Recovery-Vercel-Windows.exe',
            'BO2026-Recovery-Vercel-Windows.exe.sha256',
            'BO2026-Recovery-Render-Windows.exe',
            'BO2026-Recovery-Render-Windows.exe.sha256'
          )) {
            gh release delete-asset $tag $asset --repo $env:GITHUB_REPOSITORY --yes 2>$null
          }

          gh release upload $tag `
            .\dist\BO2026-Recovery-Windows.exe `
            .\dist\BO2026-Recovery-Windows.exe.sha256 `
            --repo $env:GITHUB_REPOSITORY `
            --clobber
