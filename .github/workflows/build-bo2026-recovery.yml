name: Build BO2026 Recovery EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - bo2026-recovery.html
      - .github/workflows/build-bo2026-recovery.yml

permissions:
  contents: write

concurrency:
  group: bo2026-recovery-windows
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build unified recovery source
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          html = Path('bo2026-recovery.html').read_text(encoding='utf-8')
          match = re.search(
              r'<script type="text/plain" id="recoveryPython">(.*?)</script>',
              html,
              flags=re.S,
          )
          if not match:
              raise SystemExit('Embedded recoveryPython script not found')

          base = match.group(1).lstrip()
          target_marker = 'HOST="bo2026.vercel.app"; ORIGIN="https://bo2026.vercel.app"; KIND="cv-cover-charm-dossier"; VERSION=1'
          out_marker = 'OUT=DESKTOP/f"BO2026-Recovery-{STAMP}"'
          if target_marker not in base:
              raise SystemExit('Recovery target marker not found')
          if out_marker not in base:
              raise SystemExit('Recovery output marker not found')

          wrapper = f'''from __future__ import annotations
          import sys
          from urllib.parse import urlsplit

          BASE_SOURCE = {base!r}
          TARGET_MARKER = {target_marker!r}
          OUT_MARKER = {out_marker!r}
          TARGETS = {{
              "1": ("Vercel", "bo2026.vercel.app", "https://bo2026.vercel.app"),
              "2": ("Render", "dev-bo2026.onrender.com", "https://dev-bo2026.onrender.com"),
          }}

          def normalize_custom(raw):
              value = (raw or "").strip()
              if not value:
                  raise ValueError("Keine Domain eingegeben.")
              if "://" not in value:
                  value = "https://" + value
              parsed = urlsplit(value)
              scheme = parsed.scheme.lower()
              if scheme not in {{"http", "https"}}:
                  raise ValueError("Nur http:// oder https:// werden unterstützt.")
              if not parsed.hostname:
                  raise ValueError("Keine gültige Domain erkannt.")
              if parsed.username or parsed.password:
                  raise ValueError("Benutzername/Passwort in der URL werden nicht unterstützt.")
              try:
                  port = parsed.port
              except ValueError as exc:
                  raise ValueError("Ungültiger Port.") from exc
              hostname = parsed.hostname.lower()
              netloc = f"[{{hostname}}]" if ":" in hostname and not hostname.startswith("[") else hostname
              if port is not None:
                  netloc += f":{{port}}"
              origin = f"{{scheme}}://{{netloc}}"
              safe = "".join(c if c.isalnum() or c in "-_." else "_" for c in netloc)
              return (f"Custom-{{safe}}", netloc, origin)

          def run_target(label, host, origin):
              print("\\n" + "=" * 64)
              print(f"BO2026 Recovery: {{label}}")
              print(f"Quelle: {{origin}}")
              print("=" * 64)
              replacement = f'HOST="{{host}}"; ORIGIN="{{origin}}"; KIND="cv-cover-charm-dossier"; VERSION=1'
              source = BASE_SOURCE.replace(TARGET_MARKER, replacement, 1)
              source = source.replace(
                  OUT_MARKER,
                  f'OUT=DESKTOP/f"BO2026-Recovery-{{label}}-{{{{STAMP}}}}"',
                  1,
              )
              namespace = {{"__name__": f"bo2026_recovery_{{label.lower()}}"}}
              exec(compile(source, f"<bo2026-recovery-{{label.lower()}}>", "exec"), namespace)
              namespace["main"]()

          def choose_targets():
              while True:
                  print("BO2026 Emergency Recovery")
                  print("-------------------------")
                  print("Welche Browserdaten sollen gerettet werden?")
                  print("  1  Vercel  - bo2026.vercel.app")
                  print("  2  Render  - dev-bo2026.onrender.com")
                  print("  3  Beide durchsuchen")
                  print("  4  Eigene Domain eingeben")
                  print("\\nEnter ohne Eingabe = Beide (empfohlen)")
                  try:
                      choice = input("Auswahl [3]: ").strip()
                  except (EOFError, KeyboardInterrupt):
                      choice = "3"
                  if choice == "1":
                      return [TARGETS["1"]]
                  if choice == "2":
                      return [TARGETS["2"]]
                  if choice in {{"", "3"}}:
                      return [TARGETS["1"], TARGETS["2"]]
                  if choice == "4":
                      try:
                          raw = input("Domain/URL (z.B. bo.schule.ch): ").strip()
                          target = normalize_custom(raw)
                          print(f"Erkannte Origin: {{target[2]}}")
                          return [target]
                      except (EOFError, KeyboardInterrupt):
                          return [TARGETS["1"], TARGETS["2"]]
                      except ValueError as exc:
                          print(f"Ungültige Domain: {{exc}}\\n")
                          continue
                  print("Bitte 1, 2, 3 oder 4 eingeben.\\n")

          def main():
              selected = choose_targets()
              for target in selected:
                  try:
                      run_target(*target)
                  except Exception as exc:
                      print(f"\\nFEHLER bei {{target[0]}}: {{exc}}")
              print("\\n" + "=" * 64)
              print("Recovery abgeschlossen.")
              print("Pruefe auf dem Desktop die BO2026-Recovery-* Ordner.")
              print("=" * 64)
              if sys.stdin.isatty():
                  try:
                      input("Enter zum Schliessen ...")
                  except (EOFError, KeyboardInterrupt):
                      pass

          if __name__ == "__main__":
              main()
          '''

          import textwrap
          wrapper = textwrap.dedent(wrapper)
          out = Path('build-src/bo2026_recover_windows.py')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(wrapper, encoding='utf-8')
          compile(wrapper, str(out), 'exec')
          print(f'Prepared unified source: {out}')
          '@ | Set-Content -Encoding UTF8 prepare_recovery.py
          py prepare_recovery.py

      - name: Validate custom domain parser
        shell: pwsh
        run: |
          @'
          import importlib.util
          from pathlib import Path
          path = Path('build-src/bo2026_recover_windows.py')
          spec = importlib.util.spec_from_file_location('bo_recovery', path)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          assert mod.normalize_custom('bo.schule.ch/test')[1:] == ('bo.schule.ch', 'https://bo.schule.ch')
          assert mod.normalize_custom('http://localhost:8080/foo')[1:] == ('localhost:8080', 'http://localhost:8080')
          print('Custom domain parser OK')
          '@ | Set-Content -Encoding UTF8 validate_custom.py
          py validate_custom.py

      - name: Install build dependencies
        shell: pwsh
        run: |
          py -m pip install --upgrade pip
          py -m pip install pyinstaller python-snappy "git+https://github.com/cclgroupltd/ccl_chromium_reader.git@ef840de30221c4d65bc96d2f4d9057e9ef2f526d"

      - name: Build standalone Windows executable
        shell: pwsh
        run: |
          py -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --console `
            --name BO2026-Recovery-Windows `
            --collect-all ccl_chromium_reader `
            --hidden-import snappy `
            build-src/bo2026_recover_windows.py

      - name: Smoke-test executable
        shell: pwsh
        run: |
          & .\dist\BO2026-Recovery-Windows.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $file = '.\dist\BO2026-Recovery-Windows.exe'
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  BO2026-Recovery-Windows.exe" | Set-Content -Encoding ASCII "$file.sha256"
          Write-Host "SHA256: $hash"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BO2026-Recovery-Windows
          path: |
            dist/BO2026-Recovery-Windows.exe
            dist/BO2026-Recovery-Windows.exe.sha256
          if-no-files-found: error

      - name: Publish stable GitHub Release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'bo2026-recovery-latest'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'BO2026 Recovery – Windows' --notes 'One BO2026 Windows recovery tool. Choose Vercel, Render, both, or enter a custom domain. Read-only browser profile recovery.' --latest
          }

          foreach ($asset in @(
            'BO2026-Recovery-Vercel-Windows.exe',
            'BO2026-Recovery-Vercel-Windows.exe.sha256',
            'BO2026-Recovery-Render-Windows.exe',
            'BO2026-Recovery-Render-Windows.exe.sha256'
          )) {
            gh release delete-asset $tag $asset --repo $env:GITHUB_REPOSITORY --yes 2>$null
          }

          gh release upload $tag `
            .\dist\BO2026-Recovery-Windows.exe `
            .\dist\BO2026-Recovery-Windows.exe.sha256 `
            --repo $env:GITHUB_REPOSITORY `
            --clobber