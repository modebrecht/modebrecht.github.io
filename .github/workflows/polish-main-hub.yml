name: Polish Main Hub

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/polish-main-hub.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Polish labels and resource categories
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace('<p class="subtitle">Berufsorientierung 2026</p>\n', '', 1)
          s = s.replace('<div class="project-copy"><h2>Berufsorientierung 2026</h2><p>Berufliche Orientierung</p></div>', '<div class="project-copy"><h2>Berufliche Orientierung</h2></div>', 1)
          s = s.replace('<div class="project-copy"><h2>BO / EE / Ressourcen</h2><p>Externe Angebote &amp; Hilfsmittel</p></div>', '<div class="project-copy"><h2>BO / EE / Ressourcen</h2></div>', 1)
          s = s.replace('content="Berufsorientierung 2026 — deployment, mirror and resources."', 'content="Berufliche Orientierung — Links und Ressourcen."', 1)

          old_css = '''    .resource-groups{display:grid;gap:10px;padding:2px 12px 14px}\n    .resource-group{padding:12px;border:1px solid var(--border);border-radius:16px;background:color-mix(in srgb,var(--surface2) 76%,transparent)}\n    .resource-title{margin:0 0 8px;color:var(--text);font-size:.78rem;font-weight:820;letter-spacing:.01em}\n    .resource-items{display:grid;gap:6px}\n    .resource-link{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:38px;padding:8px 10px;border-radius:11px;color:var(--text);text-decoration:none;background:color-mix(in srgb,var(--accent) 5%,transparent);font-size:.82rem;font-weight:690;-webkit-tap-highlight-color:transparent}\n    .resource-link span:last-child{color:var(--accent);font-size:.95rem}\n'''
          new_css = '''    .resource-groups{display:grid;gap:0;padding:0 18px 16px}\n    .resource-group{padding:14px 0;border-top:1px solid var(--border)}\n    .resource-group:first-child{border-top:0;padding-top:4px}\n    .resource-title{display:flex;align-items:center;gap:8px;margin:0 0 9px;color:var(--text);font-size:.76rem;font-weight:850;letter-spacing:.025em}\n    .resource-title::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 10%,transparent)}\n    .resource-items{display:flex;flex-wrap:wrap;gap:7px;padding-left:15px}\n    .resource-link{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:8px 11px;border:1px solid color-mix(in srgb,var(--accent) 15%,var(--border));border-radius:999px;color:var(--text);text-decoration:none;background:color-mix(in srgb,var(--surface2) 72%,transparent);font-size:.8rem;font-weight:700;-webkit-tap-highlight-color:transparent;transition:background .18s ease,border-color .18s ease,transform .18s ease}\n    .resource-link span:last-child{color:var(--accent);font-size:.88rem}\n'''
          if old_css not in s:
              raise SystemExit('resource CSS marker not found')
          s = s.replace(old_css, new_css, 1)
          s = s.replace('.resource-link:hover{background:color-mix(in srgb,var(--accent) 11%,var(--surface2))}', '.resource-link:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--accent) 34%,var(--border));background:color-mix(in srgb,var(--accent) 7%,var(--surface2))}', 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Simplify BO hub labels and polish resources"
          git push
