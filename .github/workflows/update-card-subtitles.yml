name: Update Card Subtitles

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-card-subtitles.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update card titles and subtitles
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_bo = '<div class="project-copy"><h2>Berufliche Orientierung</h2></div>'
          new_bo = '<div class="project-copy"><h2>Berufliche Orientierung</h2><p>Bewerbungsdossier erstellen</p></div>'
          old_res = '<div class="project-copy"><h2>BO / EE / Ressourcen</h2></div>'
          new_res = '<div class="project-copy"><h2>BO / EE</h2><p>Wichtige Ressourcen</p></div>'

          if old_bo not in s:
              raise SystemExit('BO title marker not found')
          if old_res not in s:
              raise SystemExit('resource title marker not found')

          s = s.replace(old_bo, new_bo, 1)
          s = s.replace(old_res, new_res, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit text update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Refine BO card labels and subtitles"
          git push
