name: Patch BO2026 Custom Domain Recovery UI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-custom-domain-recovery.yml
      - tools/patch_custom_domain_recovery.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch recovery page
        run: python tools/patch_custom_domain_recovery.py

      - name: Commit page update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bo2026-recovery.html
          git commit -m "Add custom domain to BO2026 recovery web wizard"
          git push
