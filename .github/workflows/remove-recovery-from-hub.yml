name: Remove Recovery From Hub

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-recovery-from-hub.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove recovery from main hub
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_summary = '<summary>Mirrors &amp; Recovery</summary>'
          old_recovery = '              <a class="deploy" href="./bo2026-recovery.html"><span class="host">SOS</span><span class="deploy-text"><span class="deploy-label">Emergency Recovery <span class="badge">Local data</span></span><span class="url">Browserprofil → BO2026 JSON</span></span><span class="arrow" aria-hidden="true">→</span></a>\n'
          if old_summary not in s:
              raise SystemExit('BO Mirrors & Recovery summary not found')
          if old_recovery not in s:
              raise SystemExit('BO recovery link not found')
          s = s.replace(old_summary, '<summary>Mirrors</summary>', 1)
          s = s.replace(old_recovery, '', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit hub cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Show only BO mirrors on project hub"
          git push
