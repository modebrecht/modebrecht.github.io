name: Update BO Resource Groups

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-resource-groups.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Group BO resources
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css_marker = '    .mirror-list{display:grid;gap:10px;padding-top:10px}\n'
          css_add = '''    .mirror-list{display:grid;gap:10px;padding-top:10px}\n\n    .resource-groups{display:grid;gap:10px;padding:2px 12px 14px}\n    .resource-group{padding:12px;border:1px solid var(--border);border-radius:16px;background:color-mix(in srgb,var(--surface2) 76%,transparent)}\n    .resource-title{margin:0 0 8px;color:var(--text);font-size:.78rem;font-weight:820;letter-spacing:.01em}\n    .resource-items{display:grid;gap:6px}\n    .resource-link{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:38px;padding:8px 10px;border-radius:11px;color:var(--text);text-decoration:none;background:color-mix(in srgb,var(--accent) 5%,transparent);font-size:.82rem;font-weight:690;-webkit-tap-highlight-color:transparent}\n    .resource-link span:last-child{color:var(--accent);font-size:.95rem}\n'''
          if css_marker not in s:
              raise SystemExit('CSS marker missing')
          s = s.replace(css_marker, css_add, 1)

          old = '''        <div class="links">\n          <a class="deploy" href="https://schnuppy.ch/" target="_blank" rel="noopener"><span class="host">S</span><span class="deploy-text"><span class="deploy-label">Schnuppy.ch <span class="badge">Ressource</span></span><span class="url">schnuppy.ch</span></span><span class="arrow" aria-hidden="true">↗</span></a>\n        </div>'''
          new = '''        <div class="resource-groups">\n          <section class="resource-group" aria-label="Schnuppern">\n            <h3 class="resource-title">Schnuppern</h3>\n            <div class="resource-items">\n              <a class="resource-link" href="https://schnuppy.ch/" target="_blank" rel="noopener"><span>Schnuppy.ch</span><span aria-hidden="true">↗</span></a>\n              <a class="resource-link" href="https://www.yousty.ch/de-CH/lehrstellen/bewerbung/schnuppern/schnupperlehren" target="_blank" rel="noopener"><span>Yousty · Schnupperlehren</span><span aria-hidden="true">↗</span></a>\n            </div>\n          </section>\n          <section class="resource-group" aria-label="Berufe entdecken">\n            <h3 class="resource-title">Berufe entdecken</h3>\n            <div class="resource-items">\n              <a class="resource-link" href="https://www.berufsberatung.ch/de/berufs-check" target="_blank" rel="noopener"><span>Berufs-Check</span><span aria-hidden="true">↗</span></a>\n              <a class="resource-link" href="https://www.anforderungsprofile.ch/" target="_blank" rel="noopener"><span>Anforderungsprofile</span><span aria-hidden="true">↗</span></a>\n            </div>\n          </section>\n          <section class="resource-group" aria-label="Lehrstelle finden">\n            <h3 class="resource-title">Lehrstelle finden</h3>\n            <div class="resource-items">\n              <a class="resource-link" href="https://www.berufsberatung.ch/de/lehrstelle-suchen" target="_blank" rel="noopener"><span>LENA · offene Lehrstellen</span><span aria-hidden="true">↗</span></a>\n            </div>\n          </section>\n          <section class="resource-group" aria-label="Region Solothurn">\n            <h3 class="resource-title">Region Solothurn</h3>\n            <div class="resource-items">\n              <a class="resource-link" href="https://so.ch/verwaltung/departement-fuer-bildung-kultur-und-sport/amt-fuer-berufsbildung-mittel-und-hochschulen/berufs-studien-und-laufbahnberatung/unser-angebot/beratung/berufsberatung/schnupperlehrstellen-oder-offene-lehrstellen-suchen/" target="_blank" rel="noopener"><span>BIZ Solothurn</span><span aria-hidden="true">↗</span></a>\n            </div>\n          </section>\n        </div>'''
          if old not in s:
              raise SystemExit('Current Schnuppy resource block missing')
          s = s.replace(old, new, 1)

          hover_marker = '      .mirrors summary:hover{color:var(--text);border-color:color-mix(in srgb,var(--accent) 38%,var(--border))}\n'
          hover_new = hover_marker + '      .resource-link:hover{background:color-mix(in srgb,var(--accent) 11%,var(--surface2))}\n'
          if hover_marker in s:
              s = s.replace(hover_marker, hover_new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit grouped resources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Group BO resources by student task"
          git push
