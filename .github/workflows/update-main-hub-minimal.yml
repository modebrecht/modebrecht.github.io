name: Simplify Main Hub

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-main-hub-minimal.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep only BO and simplify footer
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Hero now reflects the single primary project.
          s = s.replace('<p class="subtitle">BO · IB · WAH</p>', '<p class="subtitle">BO 2026</p>', 1)

          # Remove the full IB and WAH cards from the main grid.
          start = s.index('\n      <article class="project ib">')
          end = s.index('\n    </section>', start)
          s = s[:start] + s[end:]

          # Keep the single BO card comfortably sized on desktop.
          s = s.replace(
              '    .grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}',
              '    .grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;max-width:620px}',
              1,
          )
          s = s.replace(
              '    @media (min-width:980px){\n      .grid{grid-template-columns:repeat(3,minmax(0,1fr));align-items:start}\n      .project{width:100%}\n    }',
              '    @media (min-width:980px){\n      .project{width:100%}\n    }',
              1,
          )

          # Footer: copyright first, two discreet links underneath.
          s = s.replace(
              '    footer{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:24px;padding:13px 5px 0;color:var(--muted);font-size:.74rem}\n    footer a{color:inherit;text-decoration:none;font-weight:700}',
              '    footer{display:flex;flex-direction:column;align-items:flex-start;gap:7px;margin-top:28px;padding:13px 5px 0;color:var(--muted);font-size:.74rem}\n    .footer-links{display:flex;gap:14px;flex-wrap:wrap}\n    footer a{color:inherit;text-decoration:none;font-weight:700}',
              1,
          )
          s = s.replace(
              '    <footer><span>modebrecht.github.io</span><a href="https://github.com/modebrecht" target="_blank" rel="noopener">GitHub ↗</a></footer>',
              '    <footer>\n      <span>© GSU</span>\n      <div class="footer-links">\n        <a href="https://ib2026.vercel.app/" target="_blank" rel="noopener">IB</a>\n        <a href="https://wah2026.vercel.app/" target="_blank" rel="noopener">WAH</a>\n      </div>\n    </footer>',
              1,
          )

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit simplified hub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Keep only BO on main hub with compact footer links"
          git push
