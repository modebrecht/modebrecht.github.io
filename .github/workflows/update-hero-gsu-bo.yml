name: Update Hero GSU BO

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-hero-gsu-bo.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update hero text
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<h1>One hub.<br><span class="gradient">Every project.</span></h1>'
          new = '<h1>GSU<br><span class="gradient">BO 2026</span></h1>'
          if old not in s:
              raise SystemExit('hero marker not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit hero update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Update hub hero to GSU BO 2026"
          git push
